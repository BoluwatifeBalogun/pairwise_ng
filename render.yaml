services:
  - type: web
    name: yabatech-supervisor-allocation
    runtime: python
    plan: free
    buildCommand: bash build.sh
    # migrate + setup_site on every start. setup_site follows DEMO_MODE and creates the
    # administrator from ADMIN_EMAIL / ADMIN_PASSWORD. Without DATABASE_URL, SQLite is wiped on each restart.
    startCommand: python manage.py migrate --noinput && python manage.py setup_site && gunicorn yctalloc.wsgi --workers 1 --threads 2 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DEBUG
        value: "0"
      - key: SECRET_KEY
        generateValue: true
      - key: SBERT_THREADS
        value: "1"
      # Hosted database so accounts survive restarts. Render asks for the value when the
      # Blueprint is created. Paste the connection string from Neon (postgresql://...)
      # or a MySQL one from filess.io (mysql://USER:PASSWORD@HOST:PORT/DBNAME).
      - key: DATABASE_URL
        sync: false
      # "0" removes the fictional demonstration people, records and sign-in shortcuts.
      - key: DEMO_MODE
        value: "0"
      # Platform administrator (signs in at /admin/). Set both in the Render dashboard.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
