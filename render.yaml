services:
  - type: web
    name: pairwise-ng
    runtime: python
    plan: free
    buildCommand: ./build.sh
    # migrate + seed on every start: with the default SQLite file, Render's free disk is
    # wiped on each restart, so the demo data is rebuilt. Set DATABASE_URL to keep data.
    startCommand: python manage.py migrate --noinput && python manage.py seed_demo && gunicorn pairwise.wsgi --workers 1 --threads 4 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DEBUG
        value: "0"
      - key: SECRET_KEY
        generateValue: true
      - key: SBERT_THREADS
        value: "1"
      # - key: DATABASE_URL        # free external Postgres (Neon, Supabase) so accounts survive restarts
      #   sync: false
