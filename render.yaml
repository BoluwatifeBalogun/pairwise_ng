services:
  - type: web
    name: pairwise-ng
    runtime: python
    plan: free
    buildCommand: bash build.sh
    # migrate + seed on every start. With DATABASE_URL set, data is kept and the seed step
    # does nothing once the demo data exists. Without it, SQLite is wiped on each restart.
    startCommand: python manage.py migrate --noinput && python manage.py seed_demo && gunicorn pairwise.wsgi --workers 1 --threads 2 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DEBUG
        value: "0"
      - key: SECRET_KEY
        generateValue: true
      - key: SBERT_THREADS
        value: "1"
      # Hosted database so accounts survive restarts. Render asks for the value when the
      # Blueprint is created. Paste the connection string from Neon (postgresql://...)
      # or a MySQL one from filess.io (mysql://USER:PASSWORD@HOST:PORT/DBNAME).
      - key: DATABASE_URL
        sync: false
